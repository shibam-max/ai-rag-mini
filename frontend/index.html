<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI RAG Mini</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="workspace">
        <aside class="panel">
          <div>
            <p class="eyebrow">AI RAG Mini</p>
            <h1>Ask your document</h1>
            <p class="subtle">
              Upload a text, markdown, or PDF file. The app chunks it, retrieves matching context,
              and answers with sources.
            </p>
          </div>

          <form id="uploadForm" class="upload-box">
            <input id="fileInput" type="file" accept=".txt,.md,.pdf" />
            <button type="submit">Upload</button>
          </form>

          <div>
            <div class="row-title">
              <h2>Documents</h2>
              <button id="clearButton" class="ghost" type="button">Clear</button>
            </div>
            <div id="documents" class="documents"></div>
          </div>
        </aside>

        <section class="chat">
          <div id="messages" class="messages">
            <div class="message assistant">
              <strong>Ready.</strong>
              <p>Upload a document, then ask a question about it.</p>
            </div>
          </div>

          <form id="askForm" class="ask-bar">
            <input id="questionInput" type="text" placeholder="Ask something from the document..." />
            <button type="submit">Ask</button>
          </form>
        </section>
      </section>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
